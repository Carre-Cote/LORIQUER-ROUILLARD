<script>
const v=document.getElementById("v"),l=document.getElementById("l"),img=document.getElementById("p"),h=document.getElementById("h"),levelsNav=document.getElementById("levelsNav"),box=document.getElementById("i"),content=document.getElementById("c"); const bar=document.getElementById("bar"); function syncBarHeight(){document.documentElement.style.setProperty("--bar-height",bar.getBoundingClientRect().height+"px")} syncBarHeight(); if(window.ResizeObserver)new ResizeObserver(syncBarHeight).observe(bar); else window.addEventListener("resize",syncBarHeight);

function openComment(){

        '<input type="hidden" name="from_name" value="Carré Coté — Commentaire chantier">'+

    '</div>';

    send.disabled=true;
    send.textContent="Envoi…";

    try{

      const response=await fetch(form.action,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
      let result=null;
      try{result=await response.json()}catch(_){result=null}
      if(!response.ok || !result || result.success!==true){
        throw new Error(result&&result.message?result.message:("HTTP "+response.status));
      }
      content.innerHTML='<h2>Commentaire transmis</h2><div class="commentSuccess">Votre commentaire a bien été transmis à Carré Coté.<br><br><strong>CHANTIER '+escHtml(P?.name||"Projet")+'</strong><br>'+escHtml(activeRoom?.name||"Pièce")+'</div><div class="commentAction"><button type="button" class="commentBtn" onclick="showRoom(activeRoom)">← Retour à la pièce</button></div>';
    }catch(err){
      console.error("Web3Forms:",err);
      send.disabled=false;
      send.textContent="Réessayer";
      status.textContent="L’envoi n’a pas abouti. Vérifiez votre connexion puis réessayez.";
    }
  });
}
function escHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return escHtml(s)}
function draw(){let a=P&&P.levels[n];if(!a||!W||!H)return;let byId=new Map([...h.children].map(el=>[el.dataset.roomId,el]));let seen=new Set();a.rooms.forEach(r=>{let d=byId.get(r.id);if(!d){d=document.createElement("div");d.className="d";d.dataset.roomId=r.id;d.onclick=e=>{e.stopPropagation();showRoom(r)};h.appendChild(d)}d.style.background=r.color||"#6f42c1";d.style.transform="translate3d("+(X+W*r.x/100*S)+"px,"+(Y+H*r.y/100*S)+"px,0) translate(-50%,-50%)";seen.add(r.id)});[...h.children].forEach(el=>{if(!seen.has(el.dataset.roomId))el.remove()})}
function load(){let a=P.levels[n];W=H=0;if(!a||!a.plan){img.removeAttribute("src");h.innerHTML="";return}img.onload=()=>{W=img.naturalWidth;H=img.naturalHeight;fit()};img.onerror=()=>{h.innerHTML="";content.innerHTML="<p>Plan introuvable : "+a.plan+"</p>";box.className="i show"};img.src=a.plan}
function zoomAt(x,y,z){let ix=(x-X)/S,iy=(y-Y)/S;S=Math.max(.05,Math.min(8,z));X=x-ix*S;Y=y-iy*S;scheduleUpd()}
v.addEventListener("wheel",e=>{e.preventDefault();let r=v.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,S*(e.deltaY<0?1.12:1/1.12))},{passive:false});
const pointers=new Map();let pan=null,gesture=null;
function pt(e){let r=v.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function startGesture(){const a=[...pointers.values()];if(a.length===2){const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);gesture={d,s:S,ix:(c.x-X)/S,iy:(c.y-Y)/S};pan=null}else if(a.length===1){pan={x:a[0].x,y:a[0].y,ox:X,oy:Y};gesture=null}}
v.addEventListener("pointerdown",e=>{if(e.target.closest(".d"))return;e.preventDefault();pointers.set(e.pointerId,pt(e));try{v.setPointerCapture(e.pointerId)}catch(_){};startGesture()},{passive:false});
v.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,pt(e));const a=[...pointers.values()];if(a.length===2&&gesture){const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);S=Math.max(.05,Math.min(8,gesture.s*d/gesture.d));X=c.x-gesture.ix*S;Y=c.y-gesture.iy*S;scheduleUpd()}else if(a.length===1&&pan){X=pan.ox+a[0].x-pan.x;Y=pan.oy+a[0].y-pan.y;scheduleUpd()}},{passive:false});
function endPointer(e){pointers.delete(e.pointerId);try{v.releasePointerCapture(e.pointerId)}catch(_){};if(pointers.size)startGesture();else{pan=null;gesture=null}}
v.addEventListener("pointerup",endPointer);v.addEventListener("pointercancel",endPointer);
document.getElementById("x").onclick=()=>box.className="i";window.onresize=()=>{if(W&&H)fit()};
fetch("projet.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(data=>{P=data;if(!P.levels||!P.levels.length)throw new Error("Aucun étage dans projet.json");levelsNav.innerHTML="";P.levels.forEach((a,j)=>{let b=document.createElement("button");b.type="button";b.textContent=a.name||("Étage "+(j+1));b.className=j===0?"active":"";b.onclick=()=>{n=j;levelsNav.querySelectorAll("button").forEach((x,k)=>x.classList.toggle("active",k===j));load()};levelsNav.appendChild(b)});load()}).catch(err=>{document.body.innerHTML='<div class="err"><h2>Projet introuvable</h2><p>Impossible de charger <b>projet.json</b>.</p><p>'+String(err.message||err)+'</p></div>'});
